 if(a==='clippy'){s.chatOpen=!s.chatOpen;renderChat();refreshIcons();return size()}if(a==='chat-close'){s.chatOpen=false;if(s.page==='clippy')s.page=s.lastPage;return render()}if(a==='chat-history'){s.chatHistory=!s.chatHistory;return render()}
 if(a==='chat-full'){close();s.lastPage=s.page;s.page='clippy';s.chatOpen=true;return render()}if(a==='chat-dock'){close();s.page=s.lastPage;s.chatOpen=true;return render()}
 if(a==='chat-popout')return dialog('Clippy · separate-window preview','<div class="pc-note">Pop-out affordance retained. This is a contained window preview; no new browser window is opened.</div>'+chatMarkup(true).replaceAll('id="pc-','id="pc-pop-'),' ',true);
 if(a==='chat-new')return dialog('New Clippy conversation',field('Conversation company',cselect('pc-chat-company',s.scope)),B('Cancel','close')+B('Start sample chat','chat-new-confirm',true));
 if(a==='chat-new-confirm'){let c=modal.querySelector('#pc-chat-company').value;if(!c)return status('Choose the company for this conversation.');saveChat();s.chatId='new-'+Object.keys(chatDrafts).length;s.chatScope=c;s.chatReplies=[];s.chatText='';s.chatHistory=false;chatDrafts[s.chatId]={text:'',replies:[],scope:c,label:'New conversation · '+short[c]};close();return render()}
 if(a==='chat-approve'||a==='chat-decline'||a==='chat-stop'){if(a==='chat-approve'&&s.chatPolicy==='Read-only')return status('This conversation is read-only.');s.chatPermission=a==='chat-approve'?'approved':a==='chat-decline'?'declined':'interrupted';close();render();return status('Clippy state changed in the sample only. No action was executed.')}
 if(a==='chat-send'){if(s.chatText.trim()){s.chatReplies.push(s.chatText);s.chatText='';}close();return render()}if(a==='chat-attach')return dialog('Clippy attachment',tag('sample-context.txt')+'<p class="pc-sub">The attachment stays with this conversation’s company context.</p>');
 if(a.startsWith('tool-')){s.chatOpen=true;s.chatText='Help me plan an action using '+a.slice(5)+'.';return render()}
}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!root.contains(b))return;if(b.dataset.nav)return navigate(b.dataset.nav);if(b.dataset.company)return switchScope(b.dataset.company);if(b.dataset.shortcut)return switchScope(b.dataset.shortcut,b.dataset.dest);if(b.dataset.key){s[b.dataset.key]=b.dataset.val;if(b.dataset.key==='workTab'){s.taskDetail=false;s.routineDetail=false}return render()}if(b.dataset.folder){s.folder=b.dataset.folder;s.selected='';s.mailPane='messages';return render()}if(b.dataset.message){s.selected=b.dataset.message;s.mailPane='reader';return render()}if(b.dataset.phone){s.phonePage=b.dataset.phone;s.phoneGroup=b.dataset.group;s.phoneOpen[b.dataset.group]=true;return render()}if(b.dataset.agent){s.agent=b.dataset.agent;s.agentCompany=b.dataset.acompany;s.agentTab='Current work';return render()}if(b.dataset.event){return reminder([...baseEvents,...s.calendarEvents].find(x=>x.title===b.dataset.event))}if(b.dataset.chat){loadChat(b.dataset.chat);s.chatScope=chatDrafts[b.dataset.chat].scope;s.chatHistory=false;return render()}if(b.dataset.pin){s.pins=s.pins.includes(b.dataset.pin)?s.pins.filter(p=>p!==b.dataset.pin):[...s.pins,b.dataset.pin];return render()}if(b.dataset.setting)return dialog(b.dataset.setting+' · settings preview',tag(s.adminTab==='Company'?scopeName():'Instance scope')+'<details open><summary>Configuration</summary><div class="pc-stack">'+field('Configuration profile',select('pc-setting-profile',['Existing configuration','Proposed configuration'],'Existing configuration'))+field('Notes','<textarea placeholder="Existing detailed settings remain at this destination."></textarea>')+'</div></details><p class="pc-mini">Navigation placement preview; this is not a recreation of every administration field.</p>');if(b.dataset.a)act(b.dataset.a)});
root.addEventListener('change',e=>{const id=e.target.id.replace('pc-pop-','pc-'),v=e.target.value,c=e.target.checked;if(id==='pc-mailbox'){s.mailbox=v;s.selected='';render()}if(id==='pc-routines'){s.routines=c;render()}if(id==='pc-nesting'){s.nesting=c;render()}if(id==='pc-show-project'){s.showProject=c;render()}if(id==='pc-show-updated'){s.showUpdated=c;render()}if(id==='pc-task-status'){s.taskStatus=v;render()}if(id==='pc-task-owner'){s.taskOwner=v;render()}if(id==='pc-task-priority'){s.taskPriority=v;render()}if(id==='pc-task-project'){s.taskProject=v;render()}if(id==='pc-team-status'){s.teamStatus=v;render()}if(id==='pc-compose-company'){s.composeCompany=v;modal.querySelector('#pc-compose-from').innerHTML=options(v?[v.toLowerCase()+'@example.com']:['Choose company first'],'')}if(id==='pc-reminder-repeat'){modal.querySelector('#pc-repeat-fields').hidden=v!=='Repeats';modal.querySelector('#pc-cron-field').hidden=v!=='Cron';size()}if(id==='pc-slack-notify'){modal.querySelector('#pc-slack-target').hidden=!c;size()}if(id==='pc-all-day')modal.querySelector('#pc-reminder-time').disabled=c;if(id==='pc-phone-range'){view.querySelector('#pc-custom-range').hidden=v!=='Custom';size()}if(id==='pc-chat-model')s.chatModel=v;if(id==='pc-chat-effort')s.chatEffort=v;if(id==='pc-chat-policy'){s.chatPolicy=v;render();}if(e.target.dataset.bulkId!==undefined){const mid=e.target.dataset.bulkId;s.bulkIds=c?[...new Set([...s.bulkIds,mid])]:s.bulkIds.filter(x=>x!==mid);}if(e.target.dataset.todo!==undefined){s.todoItems[Number(e.target.dataset.todo)].done=c;render()}});
root.addEventListener('input',e=>{const id=e.target.id.replace('pc-pop-','pc-'),v=e.target.value;if(id==='pc-mail-search'||id==='pc-catalog-search'){const key=id==='pc-mail-search'?'query':'catalogQuery';s[key]=v;if(key==='query')email();else allWorkspaces();refreshIcons();const f=view.querySelector('#'+id);f.focus();f.setSelectionRange(v.length,v.length)}if(id==='pc-search-all'){modal.querySelector('#pc-search-results').innerHTML=searchResults(v);refreshIcons();size()}if(id==='pc-folder-range'){s.folderWidth=Number(v);view.querySelector('.pc-mail')?.style.setProperty('--pc-folders',v+'px')}if(id==='pc-chat-text')s.chatText=v;if(id==='pc-chat-width')root.style.setProperty('--pc-chat-width',v+'px')});
root.addEventListener('toggle',e=>{if(e.target.dataset?.phoneGroup)s.phoneOpen[e.target.dataset.phoneGroup]=e.target.open;size()},true);
root.addEventListener('pointerdown',e=>{if(e.target.id!=='pc-resizer')return;const start=e.clientX,w=s.folderWidth;e.target.setPointerCapture?.(e.pointerId);const move=ev=>{s.folderWidth=Math.max(130,Math.min(210,w+ev.clientX-start));view.querySelector('.pc-mail')?.style.setProperty('--pc-folders',s.folderWidth+'px');const range=view.querySelector('#pc-folder-range');if(range)range.value=s.folderWidth};const up=()=>{root.removeEventListener('pointermove',move);root.removeEventListener('pointerup',up)};root.addEventListener('pointermove',move);root.addEventListener('pointerup',up)});
root.addEventListener('keydown',e=>{if(e.target.id==='pc-resizer'&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();s.folderWidth=Math.max(130,Math.min(210,s.folderWidth+(e.key==='ArrowLeft'?-10:10)));view.querySelector('.pc-mail').style.setProperty('--pc-folders',s.folderWidth+'px')}if(e.key==='Escape'){if(!overlay.hidden)close();else if(s.chatOpen){s.chatOpen=false;render()}return}if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();search()}if(e.key==='Tab'&&!overlay.hidden){const els=[...modal.querySelectorAll('button,input,select,textarea')].filter(x=>!x.disabled&&!x.closest('[hidden]')),first=els[0],last=els[els.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}});
overlay.addEventListener('click',e=>{if(e.target===overlay)close()});
render();
if(globalThis.Tweak){const design={navigation:'Expanded',folderWidth:148,landing:'Email',pluginState:'Illustrative data'};const tweak=new Tweak({container:root,onChange:()=>{s.collapsed=design.navigation==='Compact rail';s.folderWidth=design.folderWidth;s.pluginState=design.pluginState;if(design.landing!==design._lastLanding){design._lastLanding=design.landing;s.page=design.landing==='Email'?'email':'overview'}render()}});design._lastLanding=design.landing;tweak.addSelect(design,'navigation',{label:'Navigation density',options:['Expanded','Compact rail']});tweak.addSlider(design,'folderWidth',{label:'Email folder width',min:130,max:210,step:10,unit:'px'});tweak.addSelect(design,'landing',{label:'Preferred landing workspace',options:['Email','Overview']});tweak.addSelect(design,'pluginState',{label:'Phone workspace state',options:['Illustrative data','Unconfigured','Failed','Empty','Permission limited']});}
})();
