      function todos(){view.innerHTML=head('My to-dos','Private to Barry · follows you across companies.',pill('Only you'))+'<div class="ops-panel ops-pad"><label class="ops-field">Quick capture<input class="ops-input" id="ops-todo-input" placeholder="Something to remember…"></label><div class="ops-row" style="margin:12px 0">'+button('Add to sample list','addtodo',true)+'</div><div id="ops-todo-list">'+row('Review next week’s priorities','Sample private to-do · does not wake an agent',button('Make this work','promotetodo'))+'</div></div>';}
      function history(){view.innerHTML=head('History & usage','Outcomes first. Full audit and diagnostics remain accessible.')+'<div class="ops-grid">'+[['Receipts','Meaningful completed outcomes, with company and source links'],['Activity','Raw events, filters, and lifecycle diagnostics'],['Runs & transcripts','Agent execution details and tool output'],['Costs & budgets','Inference, platform fees, quotas, providers, billers, and finance']].map(([t,d])=>'<section class="ops-panel ops-pad"><h2>'+t+'</h2><p class="ops-sub">'+d+'</p><div style="margin-top:13px">'+button('Inspect','history-'+t)+'</div></section>').join('')+'</div>';}
      function admin(){view.innerHTML=head('Administration','Company controls and system configuration stay distinct.')+'<div class="ops-grid">'+[['Company settings','Identity & branding; human access, invitations, secrets; import/export; company lifecycle.'],['System settings','Profile, users, outbound approvals, identities, retention, lifecycle, and defaults.'],['Integrations','Installed plugins, credentials, connections, and company availability.'],['Backups','Overview, schedules, destinations, history, and protected restore workflow.'],['Agent infrastructure','Heartbeats, templates, adapters, external MCP, runtime defaults, and experimental workspaces.'],['Diagnostics','Logs, raw events, roadmap, and advanced settings.']].map(([t,d])=>'<section class="ops-panel ops-pad"><h2>'+t+'</h2><p class="ops-sub">'+d+'</p><div style="margin-top:14px">'+button('Inspect settings group','admin-'+t)+'</div></section>').join('')+'</div>';}
      function tools(){view.innerHTML=head('Clippy & tool actions','Use installed capabilities without treating every tool as another app.')+'<div class="ops-panel ops-pad">'+[['Clippy','Contextual chat, help, and scoped action requests'],['Slack Tools','Send or manage communication through enabled tools'],['Print Tools','Print-related actions through the installed integration'],['Code Scanner','Code inspection through the installed integration']].map(([t,d])=>row(t,d,button('Preview request','tool-'+t))).join('')+'</div><p class="ops-note">Slack, Print Tools, and Code Scanner are installed, but do not all provide dedicated operator pages today. This is a proposed discoverability surface.</p>';}
      function allWorkspaces(){view.innerHTML=head('All workspaces','Every capability has a home. Pin the ones you use most.',pill('11 installed plugins mapped'))+'<div class="ops-map">'+catalog.map(c=>'<section class="ops-panel"><div class="ops-spread"><h3>'+icon(c.icon)+c.title+'</h3>'+(['email','calendar','phone','reviews'].includes(c.page)?'<button class="ops-link" data-pin="'+c.page+'">'+(state.pins.includes(c.page)?'Unpin':'Pin')+'</button>':'')+'</div><p class="ops-sub">'+c.scope+'</p><ul>'+c.items.map(i=>'<li>'+i+'</li>').join('')+'</ul><button class="ops-link" data-nav="'+c.page+'" style="margin-top:14px">Open '+c.title.toLowerCase()+' →</button></section>').join('')+'</div>';}
      function render(){navigation();({email,calendar,phone,reviews,overview,attention,work,team,knowledge,notes,todos,history,admin,tools,catalog:allWorkspaces}[state.page]||allWorkspaces)();icons();}
      function navigate(page){state.page=page;close();render();}
      function setScope(scope){state.scope=scope;state.mailbox='all';state.selected='';state.query='';close();render();announce('Scope changed to '+companyName()+'. The current workspace is preserved; selected records are cleared.');}
      function dialog(title,body,footer='',kind='info'){
        state.lastFocus=document.activeElement;state.modalKind=kind;
        modal.innerHTML='<header><h2 id="ops-dialog-title">'+title+'</h2><button class="ops-button" data-action="close" aria-label="Close dialog">'+icon('x')+'</button></header><div class="ops-stack">'+body+'</div>'+(footer?'<footer>'+footer+'</footer>':'');backdrop.hidden=false;icons();modal.querySelector('input,select,textarea,button')?.focus();
        root.querySelector('.ops-shell').style.minHeight=Math.max(root.querySelector('.ops-main').offsetHeight,modal.offsetHeight+100)+'px';
      }
      function close(){backdrop.hidden=true;state.modalKind='';root.querySelector('.ops-shell').style.minHeight='';if(state.lastFocus?.isConnected)state.lastFocus.focus();}
      function selectedMail(){return messages.find(m=>m.id===state.selected);}
      function scopeOptions(includeAll=false){return (includeAll?'<option value="all">Portfolio · all selected companies</option>':'<option value="">Choose a company…</option>')+Object.entries(companies).map(([id,n])=>'<option value="'+id+'" '+(state.scope===id?'selected':'')+'>'+esc(n)+'</option>').join('');}
      function compose(reply=false){const m=reply?selectedMail():null;dialog(reply?'Reply to conversation':'Compose email','<div class="ops-note" style="margin:0">'+(m?esc(companies[m.company])+' · '+esc(m.mailbox):'Choose the sending company and mailbox explicitly.')+'</div>'+(!m?'<label class="ops-field">Company<select class="ops-input" id="ops-sendcompany">'+scopeOptions()+'</select></label>':'')+'<label class="ops-field">From<input class="ops-input" id="ops-from" placeholder="Choose a connected sender" value="'+(m?esc(m.mailbox):'')+'"></label><label class="ops-field">To<input class="ops-input" id="ops-to" value="'+(m?esc(m.address):'')+'" placeholder="recipient@example.com"></label><label class="ops-field">Subject<input class="ops-input" value="'+(m?'Re: '+esc(m.subject):'')+'" placeholder="Subject"></label><label class="ops-field">Message<textarea class="ops-input" id="ops-draft" placeholder="Write your reply…">'+(m?.draft?esc(m.draft):'')+'</textarea></label><div class="ops-row">'+button('Draft with AI','aidraft')+button('Attachments','attachment')+'</div><span class="ops-mini">Preview only · no message can be sent from this concept.</span>',button('Cancel','close')+button('Preview send','previewsend',true),'compose');}
      function actions(action){
        const m=selectedMail();
        if(action==='close')return close();
        if(action==='scope')return dialog('Where are you operating?','<button class="ops-panel ops-companycard" data-company="all"><strong>Portfolio</strong><p class="ops-sub">All accessible companies · aggregate view</p></button>'+Object.entries(companies).map(([id,n])=>'<button class="ops-panel ops-companycard" data-company="'+id+'"><strong>'+esc(n)+'</strong><p class="ops-sub">'+(id==='HQ'?'HQ’s own agents and work — not the portfolio aggregate':id==='PER'?'Personal workspace, including Alex':'Company-scoped work and agent team')+'</p></button>').join(''));
        if(action==='compose'||action==='reply')return compose(action==='reply');
        if(action==='aidraft'){modal.querySelector('#ops-draft').value='Thanks for your message. I’m checking the details with our team and will follow up shortly.';return announce('A sample draft was inserted locally. No model or mail provider was called.');}
        if(action==='previewsend')return dialog('Review before sending','<div class="ops-note">In the product, this step confirms the company, sending identity, recipients, attachments, and applicable approval policy.</div><p>This is a local preview. Nothing was sent.</p>',button('Done','close',true));
        if(action==='handoff')return dialog('Ask an agent to handle this','<div>'+badge(m.company)+' '+pill(m.mailbox)+'</div><strong>'+esc(m.subject)+'</strong><label class="ops-field">Responsible agent<select class="ops-input" id="ops-agent"><option>'+esc(m.company==='PER'?'Alex':short[m.company]+' team agent')+'</option></select></label><label class="ops-field">What should happen?<textarea class="ops-input" id="ops-agentnote">Check the context and draft a useful reply for my review.</textarea></label><label class="ops-row"><input type="checkbox" checked disabled> Hold outbound reply for my review</label><div class="ops-note">Proposed: keep the source conversation in “With agents,” with owner and progress. Handoff does not silently change sender rules.</div>',button('Cancel','close')+button('Preview handoff','handoffconfirm',true));
        if(action==='handoffconfirm'){m.status='agent';m.owner=m.company==='PER'?'Alex':short[m.company]+' team agent';m.preview='Agent is preparing a reply for your review.';state.mailTab='agents';close();render();return announce('Sample handoff: the conversation remains visible under With agents. No Paperclip issue was created.');}
        if(action==='takeover'){m.status='handle';m.owner='You';state.mailTab='handle';render();return announce('Sample ownership returned to you. No live work changed.');}
        if(action==='linkedwork')return dialog('Conversation → linked work','<div>'+badge(m.company)+'</div><h3>'+esc(m.subject)+'</h3>'+row('Owner',esc(m.owner),pill(m.draft?'Review needed':'Working'))+row('Source','Original email remains linked in both directions')+row('Follow-through','Chat, documents, attachments, and work history remain available'),button('Back to email','close',true));
        if(action==='note')return dialog('Private support note','<label class="ops-field">Internal note<textarea class="ops-input" placeholder="Visible to the support team, not the customer"></textarea></label>',button('Keep as sample','localonly',true));
        if(action==='attachment')return dialog('Attachments','<p>Keep attachment download, preview, and upload in the email workflow. No file is uploaded or downloaded in this concept.</p>',button('Close','close'));
        if(action==='mailmore')return dialog('Message actions','<div class="ops-grid">'+['Forward','Move to folder','Read / unread','Print / pop out','Sender handling rule'].map(t=>button(t,'mailaction-'+t)).join('')+'</div><p class="ops-sub">These remain reachable without occupying every row with icons.</p>');
        if(action.startsWith('mailaction-'))return dialog(action.slice(11),'<p>Keep this existing email action in the message workspace, with company and mailbox context intact.</p><div>'+badge(m.company)+' '+pill(m.mailbox)+'</div>',button('Back to email','close'));
        if(action==='mailsettings')return dialog('Folders & handling','<div class="ops-panel ops-pad"><h3>Mailbox navigation</h3><p class="ops-sub">Inbox · Drafts · Sent · account folders · support status views</p></div><div class="ops-panel ops-pad"><h3>Sender rules</h3><p class="ops-sub">Keep always · auto-triage · muted senders</p><div class="ops-note">Proposed: a visible rule change with undo, separate from read status and delegation.</div></div><div class="ops-panel ops-pad"><h3>Views & bulk actions</h3><p class="ops-sub">Unread/all · group by sender · multi-select · move · provider-specific support actions</p></div><p class="ops-mini">Connection credentials remain in Administration → Integrations.</p>');
        if(action==='reminder')return dialog('New reminder','<label class="ops-field">Company<select class="ops-input" id="ops-remindercompany">'+scopeOptions()+'</select></label><label class="ops-field">Title<input class="ops-input" id="ops-remindertitle" placeholder="What do you need to remember?"></label><div class="ops-grid"><label class="ops-field">Date<input type="date" class="ops-input" value="2026-09-09"></label><label class="ops-field">Time<input type="time" class="ops-input" value="17:00"></label></div><label class="ops-field">Repeat<select class="ops-input"><option>Once</option><option>Every week</option><option>Every two weeks</option><option>Custom recurrence / cron</option></select></label><p class="ops-sub">America/New_York · desktop notification · 30 minutes before</p><div class="ops-note">Existing timezone, all-day, notes, recurrence, notification-channel, and lead-time options remain in reminder details.</div>',button('Cancel','close')+button('Preview reminder','reminderconfirm',true));
        if(action==='reminderconfirm'){const c=modal.querySelector('#ops-remindercompany').value,t=modal.querySelector('#ops-remindertitle').value.trim();if(!c||!t)return announce('Choose a company and enter a reminder title.');return dialog('Reminder preview','<div>'+badge(c)+'</div><h3>'+esc(t)+'</h3><p class="ops-sub">Sample reminder only. No calendar or notification was changed.</p>',button('Done','close',true));}
        if(action==='schedule'){state.workTab='Automations';return navigate('work');}
        if(action==='assistants'){state.teamTab='Assistants';return navigate('team');}
        if(action==='call')return dialog('Have Alex call someone','<div>'+badge('PER')+' '+pill('Alex · Personal EA')+'</div><label class="ops-field">Recipient<input class="ops-input" placeholder="Phone number"></label><label class="ops-field">Goal for the call<textarea class="ops-input" placeholder="What should Alex find out or accomplish?"></textarea></label><div class="ops-note">Confirm caller ID, budget, calling guardrails, and any approval requirement before execution. No call is placed in this concept.</div>',button('Cancel','close')+button('Preview call plan','localonly',true));
        if(action==='testcall'||action==='transfer')return dialog(action==='transfer'?'Human transfer setup':'Test call setup','<p>'+ (action==='transfer'?'Keep assistant-to-human transfer destination, spoken handoff, and related work configuration.':'Keep the existing assistant test-call flow and operator-phone verification.')+'</p><div class="ops-note">These controls exist for configured assistants. Opening this concept never calls a phone or saves settings.</div>',button('Close','close'));
        if(action==='reviewdraft'){state.reviewDraft=true;render();return announce('A sample review draft is now visible. No agent ran and no public response was posted.');}
        if(action==='reviewreply')return dialog('Reply to Google review','<div>'+pill('M3 Printing · location scope')+' '+pill('Proposed UI')+'</div><label class="ops-field">Public reply<textarea class="ops-input">'+(state.reviewDraft?'Thank you for sharing your experience. We’re glad you were happy with the order and look forward to helping again!':'')+'</textarea></label><div class="ops-note">Confirm the exact location and public identity. This editor is a proposed addition to the current summary-and-agent-tool workflow.</div>',button('Cancel','close')+button('Preview public reply','localonly',true));
        if(action==='opendraft'){if(state.scope!=='all')state.scope='MME';state.mailTab='agents';state.mailbox='all';state.query='';state.selected='proof';return navigate('email');}
        if(action==='openmail'){state.scope='IND';state.mailTab='all';state.mailbox='all';state.query='';state.selected='quote';return navigate('email');}
        if(action==='start'||action==='clippy'||action.startsWith('tool-'))return dialog(action==='clippy'?'Ask Clippy':action.startsWith('tool-')?action.slice(5):'What would you like done?','<label class="ops-field">Outcome<textarea class="ops-input" id="ops-outcome" placeholder="Describe the result you want, in your own words."></textarea></label><label class="ops-field">Where should this happen?<select class="ops-input" id="ops-workcompany">'+scopeOptions()+'</select></label><div class="ops-grid"><label class="ops-field">Timing<select class="ops-input"><option>Now</option><option>Schedule once</option><option>Make it recurring</option></select></label><label class="ops-field">Who handles it?<select class="ops-input"><option>Recommend an agent</option><option>I’ll handle it</option></select></label></div><div class="ops-note">Review company, accountable owner, outbound actions, and approval policy before execution. A portfolio broadcast requires explicitly selected recipients.</div>',button('Cancel','close')+button('Preview plan','planpreview',true));
        if(action==='planpreview'){const outcome=modal.querySelector('#ops-outcome').value.trim(),co=modal.querySelector('#ops-workcompany').value;if(!outcome||!co)return announce('Describe the outcome and choose the company before previewing a plan.');return dialog('Work plan · preview','<div>'+badge(co)+'</div><h3>'+esc(outcome)+'</h3>'+row('Owner','A company-scoped agent recommendation would appear here')+row('Outbound actions','Keep existing company permissions, budgets, and approval gates')+'<p class="ops-mini">No work was created or scheduled.</p>',button('Done','close',true));}
        if(action==='approvaltypes')return dialog('Attention queues','<div class="ops-stack">'+['Agent approval requests','Outbound communication review','Human access / join requests','Work needing a decision or recovery'].map(s=>'<div class="ops-panel ops-pad">'+s+'</div>').join('')+'</div><p class="ops-sub">Actual approvals and execution remain behind existing policy checks.</p>');
        if(action.startsWith('workdetail-'))return dialog(state.workTab+' detail','<h3>'+workData[state.workTab][Number(action.slice(11))][0]+'</h3><div class="ops-note">'+workData[state.workTab][Number(action.slice(11))][1]+'</div><div class="ops-row">'+['Overview','Conversation','Documents','History','Configuration'].map(s=>pill(s)).join('')+'</div><p class="ops-sub">This concept establishes the destination; existing deep screens and capabilities are preserved.</p>',button('Close','close'));
        if(action==='newagent')return dialog('Add to the team','<div class="ops-panel ops-pad"><h3>Company agent</h3><p class="ops-sub">Role, manager, instructions, adapter, permissions, and budget.</p></div><div class="ops-panel ops-pad"><h3>Assistant</h3><p class="ops-sub">Existing eight-step builder: persona, behavior, guardrails, channels, voice, number, and testing.</p></div>');
        if(action==='knowledge')return navigate('knowledge');
        if(action.startsWith('knowledge-')||action.startsWith('history-')||action.startsWith('admin-'))return dialog(action.slice(action.indexOf('-')+1),'<p>Existing functionality remains available in this dedicated group, rather than competing with daily work in the main sidebar.</p><div class="ops-note">'+(action.startsWith('admin-')?'Settings must explicitly identify company or instance scope. No setting changes are possible here.':'Company boundaries, record links, filters, and detailed inspection are preserved.')+'</div>');
        if(action==='newnote')return dialog('Capture a company note','<label class="ops-field">Company<select class="ops-input">'+scopeOptions()+'</select></label><label class="ops-field">Note<textarea class="ops-input" placeholder="Capture the thought without starting an agent."></textarea></label>',button('Keep as sample','localonly',true));
        if(action==='addtodo'){const input=view.querySelector('#ops-todo-input'),value=input.value.trim();if(!value)return announce('Enter a to-do first.');view.querySelector('#ops-todo-list').insertAdjacentHTML('afterbegin',row(esc(value),'Local sample · private to you',button('Make this work','promotetodo')));input.value='';return announce('Added to the sample list only. No agent was started.');}
        if(action==='promotetodo')return dialog('Turn a private to-do into work','<label class="ops-field">Target company<select class="ops-input">'+scopeOptions()+'</select></label><div class="ops-note">Preview what will become visible to the company, choose an owner, and preserve the original private note.</div>',button('Cancel','close')+button('Preview conversion','localonly',true));
        if(action==='localonly'){close();return announce('Preview complete. Nothing was sent, posted, called, saved, or executed in the live app.');}
      }
      root.addEventListener('click',e=>{
        const b=e.target.closest('button');if(!b||!root.contains(b))return;
        if(b.dataset.nav)return navigate(b.dataset.nav);
        if(b.dataset.company)return setScope(b.dataset.company);
        if(b.dataset.mailtab){state.mailTab=b.dataset.mailtab;return render();}
        if(b.dataset.message){state.selected=b.dataset.message;return render();}
        if(b.dataset.tab){state[b.dataset.tab]=b.dataset.value;return render();}
        if(b.dataset.phonedetail){state.phoneDetail=b.dataset.phonedetail;return render();}
        if(b.dataset.pin){state.pins=state.pins.includes(b.dataset.pin)?state.pins.filter(p=>p!==b.dataset.pin):state.pins.concat(b.dataset.pin);render();return announce('Sidebar pin updated in the concept. The workspace remains in All workspaces.');}
        if(b.dataset.event!==undefined){const ev=events[Number(b.dataset.event)];return dialog(ev.title,'<div>'+badge(ev.company)+'</div><p>September '+ev.day+' · '+ev.time+' · America/New_York</p><p class="ops-sub">'+ev.meta+'</p><div class="ops-note">Reminder details retain notes, recurrence, notification channels, lead time, and status.</div>',button('Close','close'));}
        if(b.dataset.agent)return dialog(b.dataset.agent,'<div class="ops-row">'+['Current work','Instructions','Skills','Runs','Configuration','Budget','Channels'].map(s=>pill(s)).join('')+'</div><p class="ops-sub">Lead with responsibility and current work. Keep the full existing agent detail available.</p>',button('Close','close'));
        if(b.dataset.action)return actions(b.dataset.action);
      });
      root.addEventListener('change',e=>{if(e.target.id==='ops-mobile-nav')navigate(e.target.value);if(e.target.id==='ops-mailbox'){state.mailbox=e.target.value;render();}if(e.target.id==='ops-schedules'){state.schedules=e.target.checked;render();}});
      root.addEventListener('input',e=>{if(e.target.id==='ops-mailsearch'){const caret=e.target.selectionStart;state.query=e.target.value;email();icons();const q=view.querySelector('#ops-mailsearch');q.focus();if(q.type!=='search')q.setSelectionRange(caret,caret);}});
      backdrop.addEventListener('click',e=>{if(e.target===backdrop)close();});
      root.addEventListener('keydown',e=>{if(backdrop.hidden)return;if(e.key==='Escape'){e.preventDefault();close();}if(e.key==='Tab'){const controls=Array.from(modal.querySelectorAll('button,input,select,textarea,a[href]')).filter(el=>!el.disabled);const first=controls[0],last=controls[controls.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}});
      render();
    })();
  </script>
</div>
